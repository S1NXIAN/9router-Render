name: Keep Render Warm

on:
  schedule:
    - cron: "*/14 * * * *" # keep warm, Render sleeps after 15m
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          URL="${{ vars.RENDER_URL || secrets.RENDER_URL }}"
          if [ -z "$URL" ]; then
            echo "RENDER_URL not set (vars.RENDER_URL or secrets.RENDER_URL). Skipping."
            echo "Set repo Settings -> Variables -> RENDER_URL=https://xxx.onrender.com"
            exit 0
          fi
          echo "Pinging $URL/health"
          curl -fsS --max-time 10 "$URL/health" -o /dev/null && echo "ok" || echo "ping failed (service may be deploying)"
