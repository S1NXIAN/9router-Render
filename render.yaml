services:
  - type: web
    name: 9router
    env: docker
    plan: free
    region: singapore # closest to SG/ASIA — change to oregon, frankfurt, ohio, virginia based on whats closest & plan availability
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: DATA_DIR
        value: /app/data
      # Render injects PORT=10000 automatically — do not set it here
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_PASSWORD
        sync: false
      # Keep Render free tier warm — pings /health every 14m (spin-down is 15m). Disable with false.
      - key: SELF_PING_ENABLED
        value: true
      # External keep-warm (required to wake suspended container) — see .github/workflows/keepwarm.yml
      # Set repo Variable RENDER_URL=https://xxx.onrender.com to enable GitHub Actions pinger.
      # Set manually in Render Dashboard → Environment after first deploy if you need
      # cloud sync / OAuth callbacks on your https://xxx.onrender.com URL:
      #   BASE_URL=https://xxx.onrender.com
      #   NEXT_PUBLIC_BASE_URL=https://xxx.onrender.com
      #   CLOUD_URL=https://9router.com (optional)
    # --- Persistent disk (requires Starter plan+) ---
    # Free tier filesystem ephemeral — SQLite at /app/data lost on redeploy.
    # Uncomment for persistence (1GB plenty).
    # disk:
    #   name: 9router-data
    #   mountPath: /app/data
    #   sizeGB: 1

